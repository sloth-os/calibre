<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="calibre WASM could not load because you are offline.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#21252b">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
<title>Offline — calibre WASM</title>
<style>
  /* Palette mirrors index.html. */
  :root {
    color-scheme: dark light;
    --bg: #21252b;
    --card: #2d333e;
    --border: #3d4450;
    --fg: #e6e9ef;
    --muted: #98a2b3;
    --accent: #6ea8fe;
    --control-bg: #262b33;
    --control-border: #3d4450;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --border: #d6dbe4;
      --fg: #1b2029;
      --muted: #5c6572;
      --accent: #2563eb;
      --control-bg: #eaeef4;
      --control-border: #c7cfdb;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  main {
    width: 100%;
    max-width: 34rem;
    margin: 1.5rem;
    padding: 2.25rem 1.75rem;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  svg { width: 68px; height: 68px; color: var(--muted); }
  h1 { margin: .9rem 0 .4rem; font-size: 1.35rem; font-weight: 650; }
  p { margin: 0 0 1.4rem; color: var(--muted); }
  .actions { display: flex; gap: .65rem; justify-content: center; flex-wrap: wrap; }
  button, a.btn {
    font: inherit;
    padding: .55rem 1.15rem;
    border-radius: 9px;
    border: 1px solid var(--control-border);
    background: var(--control-bg);
    color: var(--fg);
    text-decoration: none;
    cursor: pointer;
  }
  button:hover, a.btn:hover { border-color: var(--accent); }
  button:focus-visible, a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" role="img" aria-label="Open book" fill="none" stroke="currentColor"
       stroke-width="1.6" stroke-linejoin="round">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/>
    <path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-2.5"/>
 </svg>
  <h1>You are offline</h1>
  <p>You are offline and this page was not cached. Load the converter once while online — after that it works offline.</p>
  <div class="actions">
    <button type="button" onclick="location.reload()">Retry</button>
    <a class="btn" href="./index.html">Back to calibre WASM</a>
  </div>
</main>
</body>
</html>
